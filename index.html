<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c48"><meta name="description" content="An interactive island designed by Lingzhi Yang."><title>Neon Tide</title>  <script type="module" crossorigin src="./assets/index-BNDH_Dxv.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DvvrYAp9.css">
</head>
<body><div id="scene" aria-label="Interactive island. Drag to orbit and scroll to zoom."></div>
<div id="loading"><p>Coming ashore</p><small id="load-status">Preparing the island…</small></div>
<header><button id="sound" class="icon-button" aria-pressed="false" title="Toggle ambient sound">Sound off <span>♫</span></button></header>
<main><section class="intro"><h1>Neon Tide</h1><button id="explore" class="text-button" aria-expanded="false">Explore island <span>↗</span></button><small class="credit">Designed by Lingzhi Yang</small><nav id="places" aria-label="Island landmarks" hidden><button data-place="lighthouse">Lighthouse</button><button data-place="cafe">Café</button><button data-place="port">Harbor</button></nav></section>
<aside class="controls" aria-label="Environment"><div class="control-title"><button id="reset" title="Reset camera">↺ Reset view</button></div><fieldset><legend>Time <span id="time-label" hidden></span></legend><div class="segments" id="time-options"><button data-time="day" aria-pressed="false">Day</button><button data-time="dusk" aria-pressed="true">Dusk</button><button data-time="night" aria-pressed="false">Night</button></div></fieldset><fieldset><legend>Weather <span id="weather-label" hidden></span></legend><div class="segments" id="weather-options"><button data-weather="clear" aria-pressed="true">Clear</button><button data-weather="fog" aria-pressed="false">Mist</button><button data-weather="rain" aria-pressed="false">Rain</button></div></fieldset><span id="conditions" hidden></span></aside>
<aside id="detail" aria-label="Landmark details" hidden><button id="close-detail" aria-label="Close details">×</button><span class="eyebrow" id="detail-number"></span><h2 id="detail-title"></h2><p id="detail-copy"></p><button id="detail-action" class="action-button"></button><small id="detail-status" aria-live="polite"></small></aside></main>
<div id="tooltip" hidden></div><footer><span>Drag to orbit · Scroll to zoom</span><button id="motion" aria-pressed="false">Pause motion</button></footer><div id="notice" role="status" aria-live="polite"></div></body></html>
